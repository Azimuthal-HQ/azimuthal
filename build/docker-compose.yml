# One command to run Azimuthal:
# docker compose -f build/docker-compose.yml up -d
#
# Copy .env.example to .env and fill in your values first.

services:

  app:
    image: ghcr.io/azimuthal-hq/azimuthal:${AZIMUTHAL_VERSION:-latest}
    # The image ENTRYPOINT already runs `serve`; no command override needed.
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    # There is deliberately no `env_file:` here. This block is the ONLY channel
    # from .env into the container, and it names every setting the binary reads
    # so that the channel stays visible: a variable that is not listed here does
    # not reach the application, however plainly it is written in .env.
    #
    # WHY BARE ${KEY} AND NOT ${KEY:-default}. viper is configured without
    # AllowEmptyEnv, so a variable that is present but empty — which is exactly
    # what `KEY: ${KEY}` produces when KEY is absent from .env — is treated as
    # unset and falls through to the default in internal/config. Repeating the
    # default here would therefore add nothing except a second place for it to
    # be wrong, which is not hypothetical: this file used to send
    # `SMTP_PORT: ${SMTP_PORT:-25}` while the binary's own default was 1025.
    # Bare forwarding makes that class of divergence unrepresentable.
    #
    # TestComposeForwardsEverySetting (internal/config) fails if a setting is
    # added to internal/config and not to this list, or forwarded here with a
    # default that could drift.
    environment:
      # Managed by Compose — these address the sibling services and must not be
      # overridable, or the app would be pointed away from the stack it ships with.
      DATABASE_URL: postgres://azimuthal:${POSTGRES_PASSWORD}@db:5432/azimuthal?sslmode=disable
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      APP_ENV: production
      APP_PORT: "8080"

      # Core
      APP_BASE_URL: ${APP_BASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}

      # Object storage
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_USE_SSL: ${STORAGE_USE_SSL}

      # Authentication and access
      AZIMUTHAL_BCRYPT_COST: ${AZIMUTHAL_BCRYPT_COST}
      AZIMUTHAL_ALLOWED_ORIGINS: ${AZIMUTHAL_ALLOWED_ORIGINS}
      AZIMUTHAL_ALLOW_REGISTRATION: ${AZIMUTHAL_ALLOW_REGISTRATION}
      JWT_EXPIRY: ${JWT_EXPIRY}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH}

      # Invitations and the customer portal
      AZIMUTHAL_INVITE_DELIVERY: ${AZIMUTHAL_INVITE_DELIVERY}
      AZIMUTHAL_INVITE_TTL: ${AZIMUTHAL_INVITE_TTL}
      AZIMUTHAL_PORTAL_LINK_DELIVERY: ${AZIMUTHAL_PORTAL_LINK_DELIVERY}
      AZIMUTHAL_PORTAL_LINK_TTL: ${AZIMUTHAL_PORTAL_LINK_TTL}
      AZIMUTHAL_PORTAL_SESSION_TTL: ${AZIMUTHAL_PORTAL_SESSION_TTL}
      AZIMUTHAL_CREDENTIAL_LINK_TTL: ${AZIMUTHAL_CREDENTIAL_LINK_TTL}
      # Forwarded because every setting internal/config reads must be reachable
      # from an operator's .env, and inert in this stack for two independent
      # reasons: APP_ENV is production above, and disclosure is refused in
      # production whatever this holds
      # (config.Config.PortalLinkDisclosureAllowed). Setting it here produces
      # neither disclosure nor an error — see that method for why it degrades
      # rather than refusing.
      AZIMUTHAL_PORTAL_DISCLOSE_LINK: ${AZIMUTHAL_PORTAL_DISCLOSE_LINK}

      # Email. SMTP_HOST and SMTP_FROM are bare for a second reason beyond the one
      # above: config.validate tests BOTH with a RAW os.Getenv (D140), to tell
      # "the operator configured a relay / from-address" from the "localhost" and
      # "azimuthal@localhost" defaults. A `:-default` here would satisfy those
      # checks unconditionally and silently disable the guard that refuses
      # AZIMUTHAL_INVITE_DELIVERY=email without an explicit relay and from-address.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      # SMTP transport security and auth (D3). Default TLS mode is "none" (local
      # relay); set starttls/implicit and the username/password for a real relay.
      SMTP_TLS: ${SMTP_TLS}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}

      # Auth-surface rate limiting (D3). Per-IP token bucket on the
      # unauthenticated auth endpoints; process-local, so per instance.
      AZIMUTHAL_AUTH_RATE_LIMIT_ENABLED: ${AZIMUTHAL_AUTH_RATE_LIMIT_ENABLED}
      AZIMUTHAL_AUTH_RATE_LIMIT_PER_MINUTE: ${AZIMUTHAL_AUTH_RATE_LIMIT_PER_MINUTE}
      AZIMUTHAL_AUTH_RATE_LIMIT_BURST: ${AZIMUTHAL_AUTH_RATE_LIMIT_BURST}

      # Operations
      AZIMUTHAL_TICKET_REF_REQUIRED: ${AZIMUTHAL_TICKET_REF_REQUIRED}
      AZIMUTHAL_QUEUE_ENABLED: ${AZIMUTHAL_QUEUE_ENABLED}
      # MIGRATIONS_DIR is deliberately absent: it is read only by the separate
      # `migrate` command (cmd/migrate), never by `serve`, which uses the
      # migrations embedded in the binary. Forwarding it would imply otherwise.
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: azimuthal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: azimuthal
    volumes:
      - azimuthal_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "azimuthal"]
      interval: 5s
      retries: 5

  storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - azimuthal_storage:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 5

volumes:
  azimuthal_db:
  azimuthal_storage:
