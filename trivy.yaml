# trivy.yaml
# Container and filesystem scanning config
# Docs: https://trivy.dev/latest/docs/references/configuration/config-file/
#
# Read by `make scan-container` (explicitly, via --config) and by CI's
# container-scan job (implicitly — trivy defaults --config to ./trivy.yaml,
# and the CI log line `Loaded file_path="trivy.yaml"` is the proof it took).

scan:
  scanners:
    - vuln      # CVE scanning
    - misconfig # Misconfiguration checks
    - secret    # Secrets in container layers

pkg:
  types:
    - os        # OS package vulnerabilities
    - library   # Language-level dependencies (Go modules)

vulnerability:
  ignore-unfixed: true  # Skip CVEs with no available patch

severity:
  - HIGH
  - CRITICAL

# Exit code 1 on findings — enforced in CI
exit-code: 1

# Output format
format: table  # human-readable in CI logs; CI also captures SARIF

# Cache for faster repeated scans in CI
cache:
  dir: /tmp/trivy-cache

# Skip known false positives — add CVE suppressions to trivy-ignore.yaml when needed,
# then uncomment the line below. Both trivy-ignore.yaml and docs/security-scanning.md
# tell you to "uncomment the ignore-policy line in trivy.yaml"; until now there was no
# such line to uncomment, commented or otherwise, so the instruction could not be
# followed as written.
#
# Leave it commented while trivy-ignore.yaml holds no active rules: an empty Rego
# module is a parse error, not a no-op.
#
# ignore-policy: trivy-ignore.yaml
