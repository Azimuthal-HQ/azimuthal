name: CI

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci2-${{ github.ref }}
  cancel-in-progress: true


env:
  GO_VERSION: '1.26'
  POSTGRES_VERSION: '16'
  BINARY_NAME: azimuthal

jobs:

  # ─────────────────────────────────────────────────────────────
  # GATE 1: Build
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: azimuthal
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend assets
        run: cd web && npm ci && npm run build

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build binary
        run: go build -v -o /tmp/${{ env.BINARY_NAME }} ./cmd/server

      - name: Vet
        run: go vet ./...


  # ─────────────────────────────────────────────────────────────
  # GATE 2: Test
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test
    needs: build
    runs-on: azimuthal
    # No services: block — postgres + minio started manually after Docker-wait
    # (DinD daemon may not be ready when services: fires, causing instant failure)
    env:
      DATABASE_URL: postgres://azimuthal_test:testpassword@localhost:5433/azimuthal_test?sslmode=disable
      JWT_SECRET: ci-test-secret-32-chars-minimum-xx
      STORAGE_ENDPOINT: http://localhost:9001
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: azimuthal-test
      APP_ENV: test
      # CGO_ENABLED is NOT set here — only go test -race needs it, set per-step below.
      # Setting it job-wide causes every go run/build to need gcc before it's installed.

    steps:
      - uses: actions/checkout@v4

      # Set up Go before Docker wait — gives DinD daemon more time to start
      # while we do non-Docker work (download modules, install goose, etc.)
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create stub frontend dist (for go:embed)
        run: mkdir -p web/dist && echo '<!DOCTYPE html><html><body>stub</body></html>' > web/dist/index.html

      # Compile + vet before Docker wait — DinD startup is variable (10-180s on k3s);
      # this gives the daemon ~90s of initialization time before we need it.
      - name: Compile and vet (gives DinD extra startup time)
        run: go build ./... && go vet ./...

      # By now DinD has had ~90s to start — confirm it's ready.
      - name: Wait for Docker daemon
        run: |
          echo "Waiting for Docker daemon..."
          for i in $(seq 1 90); do
            docker info >/dev/null 2>&1 && echo "Docker daemon ready after $((i*2))s" && break
            sleep 2
          done
          docker info
          # DinD bridge networking takes extra time after daemon starts.
          # Without this sleep, docker pull fails immediately with network errors.
          echo "Sleeping 30s for DinD bridge networking to settle..."
          sleep 30
          echo "Proceeding with image pulls."

      # Pull images explicitly with retry BEFORE docker run.
      # docker run pulls synchronously and exits non-zero on pull failure.
      - name: Pull container images (with retry)
        run: |
          for img in postgres:16-alpine quay.io/minio/minio:latest; do
            echo "=== Pulling $img ==="
            for attempt in $(seq 1 10); do
              docker pull "$img" && echo "✅ Pulled $img" && break
              echo "Pull attempt $attempt/10 failed, retrying in 30s..."
              sleep 30
              [ "$attempt" = "10" ] && echo "❌ Failed to pull $img after 10 attempts" && exit 1
            done
          done

      - name: Start postgres
        run: |
          docker run -d --name postgres \
            -p 5433:5432 \
            -e POSTGRES_USER=azimuthal_test \
            -e POSTGRES_PASSWORD=testpassword \
            -e POSTGRES_DB=azimuthal_test \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U azimuthal_test 2>/dev/null && \
              echo "postgres ready after $((i*2))s" && break
            sleep 2
          done
          for retry in $(seq 1 5); do
            docker exec postgres pg_isready -U azimuthal_test && break
            [ "$retry" = "5" ] && echo "❌ postgres never became ready" && exit 1
            sleep 2
          done

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9001:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 15); do
            curl -sf http://localhost:9001/minio/health/live 2>/dev/null && \
              echo "MinIO ready after $((i*2))s" && break
            sleep 2
          done
          curl -sf http://localhost:9001/minio/health/live || \
            (echo "❌ MinIO never became ready" && exit 1)

      - name: Run migrations
        run: go run ./cmd/migrate

      # -race requires CGO; ensure gcc is present on the minimal runner image.
      - name: Install C build tools (required for -race detector)
        run: |
          which gcc && gcc --version || \
            (sudo apt-get update -qq && sudo apt-get install -y -q build-essential)

      - name: Run tests with race detector
        env:
          CGO_ENABLED: "1"  # -race requires CGO; gcc installed in previous step
        run: |
          go test \
            -v \
            -race \
            -p 1 \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -coverpkg=./internal/... \
            -timeout=600s \
            ./... 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}

      - name: Upload test output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: test-output.txt
          retention-days: 3

      - name: Enforce minimum coverage (70%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below the 70% floor"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets minimum"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7


  # ─────────────────────────────────────────────────────────────
  # GATE 3: Lint
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    needs: build
    runs-on: azimuthal
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create stub frontend dist (for go:embed)
        run: mkdir -p web/dist && echo '<!DOCTYPE html><html><body>stub</body></html>' > web/dist/index.html

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          args: --config=.golangci.yml --timeout=5m

      - name: Check go.sum is up to date
        run: |
          go mod tidy
          git diff --exit-code go.sum || \
            (echo "❌ go.sum out of date — run go mod tidy" && exit 1)


  # ─────────────────────────────────────────────────────────────
  # GATE 4A: SAST
  # ─────────────────────────────────────────────────────────────
  sast:
    name: SAST (gosec)
    needs: build
    runs-on: azimuthal
    timeout-minutes: 40
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create stub frontend dist (for go:embed)
        run: mkdir -p web/dist && echo '<!DOCTYPE html><html><body>stub</body></html>' > web/dist/index.html

      # Cache the compiled gosec binary so we only compile once per version.
      # go install on a 200m-CPU runner takes 20+ min — the cache cuts it to ~1s.
      - name: Cache gosec binary
        id: gosec-cache
        uses: actions/cache@v4
        with:
          path: .gosec-bin
          key: gosec-linux-amd64-v2.26.1

      - name: Install gosec
        if: steps.gosec-cache.outputs.cache-hit != 'true'
        run: GOBIN=$GITHUB_WORKSPACE/.gosec-bin go install github.com/securego/gosec/v2/cmd/gosec@v2.26.1

      - name: Add gosec to PATH
        run: echo "$GITHUB_WORKSPACE/.gosec-bin" >> $GITHUB_PATH

      - name: Run gosec (SARIF output for Security tab)
        run: |
          gosec \
            -severity high \
            -confidence high \
            -exclude-dir=vendor \
            -fmt sarif \
            -out gosec-results.sarif \
            ./... || true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true  # requires GitHub Advanced Security; skip gracefully on free plans
        with:
          sarif_file: gosec-results.sarif
          category: gosec

      - name: Fail on HIGH+ findings
        run: |
          gosec \
            -severity high \
            -confidence high \
            -exclude-dir=vendor \
            ./...


  # ─────────────────────────────────────────────────────────────
  # GATE 4B: Dependency vulnerability scanning
  # ─────────────────────────────────────────────────────────────
  vuln-scan:
    name: Dependency Scan (govulncheck)
    needs: build
    runs-on: azimuthal
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create stub frontend dist (for go:embed)
        run: mkdir -p web/dist && echo '<!DOCTYPE html><html><body>stub</body></html>' > web/dist/index.html

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Generate JSON vulnerability report
        if: always()
        run: govulncheck -json ./... > vuln-report.json || true

      - name: Upload vulnerability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vuln-report
          path: vuln-report.json
          retention-days: 7


  # ─────────────────────────────────────────────────────────────
  # GATE 4C: Secret scanning
  # ─────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: azimuthal
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}


  # ─────────────────────────────────────────────────────────────
  # GATE 4D: Container scanning
  # ─────────────────────────────────────────────────────────────
  container-scan:
    name: Container Scan (trivy)
    needs: build
    runs-on: azimuthal
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create stub frontend dist (for go:embed)
        run: mkdir -p web/dist && echo '<!DOCTYPE html><html><body>stub</body></html>' > web/dist/index.html

      # Build binary on runner (avoids pulling golang:1.26-alpine from Docker Hub)
      - name: Build binary (gives DinD extra startup time)
        run: |
          go build ./... && go vet ./...
          CGO_ENABLED=0 GOOS=linux go build \
            -trimpath \
            -ldflags="-s -w" \
            -o azimuthal \
            ./cmd/server

      - name: Wait for Docker daemon
        run: |
          for i in $(seq 1 90); do
            docker info >/dev/null 2>&1 && echo "Docker ready after $((i*2))s" && break
            sleep 2
          done
          docker info
          echo "Sleeping 30s for DinD bridge networking to settle..."
          sleep 30

      # Dockerfile.ci only needs distroless (GCR, no rate limit) — no Docker Hub pulls.
      - name: Pull distroless base image (with retry)
        run: |
          for attempt in $(seq 1 10); do
            docker pull gcr.io/distroless/static:nonroot && echo "✅ Pulled distroless" && break
            echo "Pull attempt $attempt/10 failed, retrying in 30s..."
            sleep 30
            [ "$attempt" = "10" ] && echo "❌ Failed to pull distroless after 10 attempts" && exit 1
          done

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.BINARY_NAME }}:scan-${{ github.sha }} \
            -f build/Dockerfile.ci \
            .

      - name: Run Trivy (SARIF output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BINARY_NAME }}:scan-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true  # requires GitHub Advanced Security; skip gracefully on free plans
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Fail on HIGH/CRITICAL findings
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BINARY_NAME }}:scan-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library

      - name: Clean up image
        if: always()
        run: docker rmi ${{ env.BINARY_NAME }}:scan-${{ github.sha }} || true


  # ─────────────────────────────────────────────────────────────
  # GATE 5: E2E Tests
  # ─────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    needs: [build, test]
    runs-on: azimuthal
    # No services: block — postgres + minio started manually after Docker-wait
    env:
      DATABASE_URL: postgres://azimuthal_test:testpassword@localhost:5433/azimuthal_test?sslmode=disable
      JWT_SECRET: ci-e2e-test-secret-32-chars-minimum
      STORAGE_ENDPOINT: http://localhost:9001
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: azimuthal-test
      APP_ENV: test
      APP_PORT: "8082"
      BASE_URL: http://localhost:8082
      AZIMUTHAL_BINARY: /tmp/azimuthal-test

    steps:
      - uses: actions/checkout@v4

      # Set up Go and Node before Docker wait — gives DinD daemon more time to start
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # Build frontend first — go:embed all:dist requires web/dist to exist before go build
      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: Compile and vet (gives DinD extra startup time)
        run: go build ./... && go vet ./...

      - name: Wait for Docker daemon
        run: |
          for i in $(seq 1 90); do
            docker info >/dev/null 2>&1 && echo "Docker daemon ready after $((i*2))s" && break
            sleep 2
          done
          docker info
          echo "Sleeping 30s for DinD bridge networking to settle..."
          sleep 30

      - name: Pull container images (with retry)
        run: |
          for img in postgres:16-alpine quay.io/minio/minio:latest; do
            echo "=== Pulling $img ==="
            for attempt in $(seq 1 10); do
              docker pull "$img" && echo "✅ Pulled $img" && break
              echo "Pull attempt $attempt/10 failed, retrying in 30s..."
              sleep 30
              [ "$attempt" = "10" ] && echo "❌ Failed to pull $img after 10 attempts" && exit 1
            done
          done

      - name: Start postgres
        run: |
          docker run -d --name postgres \
            -p 5433:5432 \
            -e POSTGRES_USER=azimuthal_test \
            -e POSTGRES_PASSWORD=testpassword \
            -e POSTGRES_DB=azimuthal_test \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U azimuthal_test 2>/dev/null && \
              echo "postgres ready after $((i*2))s" && break
            sleep 2
          done
          for retry in $(seq 1 5); do
            docker exec postgres pg_isready -U azimuthal_test && break
            [ "$retry" = "5" ] && echo "❌ postgres never became ready" && exit 1
            sleep 2
          done

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9001:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 15); do
            curl -sf http://localhost:9001/minio/health/live 2>/dev/null && \
              echo "MinIO ready after $((i*2))s" && break
            sleep 2
          done
          curl -sf http://localhost:9001/minio/health/live || \
            (echo "❌ MinIO never became ready" && exit 1)

      - name: Run migrations
        run: go run ./cmd/migrate

      - name: Build binary
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o /tmp/azimuthal-test \
            ./cmd/server

      - name: Install Playwright browsers
        run: cd web && npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: cd web && npx playwright test --reporter=list
        timeout-minutes: 10
        env:
          BASE_URL: http://localhost:8082
          AZIMUTHAL_BINARY: /tmp/azimuthal-test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Upload test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 3


  # ─────────────────────────────────────────────────────────────
  # GATE 6: API Docs Check
  # ─────────────────────────────────────────────────────────────
  docs-check:
    name: API Docs Check
    needs: build
    runs-on: azimuthal
    steps:
      - uses: actions/checkout@v4

      - name: Validate OpenAPI 3.0 structure
        run: |
          SPEC=docs/api/openapi.yaml
          ERRORS=0

          # Must be OpenAPI 3.x
          grep -q "^openapi: 3" "$SPEC" \
            || { echo "❌ Not OAS3 — missing 'openapi: 3.x' at root"; ERRORS=$((ERRORS+1)); }

          # Must have non-empty title and version under info:
          grep -q "^info:" "$SPEC" \
            || { echo "❌ Missing info: block"; ERRORS=$((ERRORS+1)); }
          grep -q "title:" "$SPEC" \
            || { echo "❌ info.title missing"; ERRORS=$((ERRORS+1)); }
          grep -q "version:" "$SPEC" \
            || { echo "❌ info.version missing"; ERRORS=$((ERRORS+1)); }

          # Must have BearerAuth security scheme
          grep -q "BearerAuth:" "$SPEC" \
            || { echo "❌ BearerAuth not found in securitySchemes"; ERRORS=$((ERRORS+1)); }

          # Must have required paths
          grep -q "/auth/login:" "$SPEC" \
            || { echo "❌ Required path missing: /auth/login"; ERRORS=$((ERRORS+1)); }
          grep -q "/auth/me:" "$SPEC" \
            || { echo "❌ Required path missing: /auth/me"; ERRORS=$((ERRORS+1)); }

          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ OpenAPI spec validation failed ($ERRORS errors)"
            exit 1
          fi

          VERSION=$(grep "^openapi:" "$SPEC" | awk '{print $2}')
          ENDPOINTS=$(grep -c "^  /" "$SPEC" || true)
          echo "✅ OpenAPI ${VERSION} spec valid (${ENDPOINTS} top-level paths)"


  # ─────────────────────────────────────────────────────────────
  # GATE 7: Docker image boots and serves the app
  # Audit ref: testing-audit.md §7.3 — would have caught v0.1.1 directly.
  # ─────────────────────────────────────────────────────────────
  docker-e2e:
    name: Docker image boot
    needs: build
    runs-on: azimuthal
    # No services: block — postgres started manually after Docker-wait

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # Build real frontend first (needed for go:embed and the frontend bundle check)
      - name: Build frontend assets
        run: cd web && npm ci && npm run build

      # Build binary with embedded real frontend — gives DinD time to start
      - name: Build binary (gives DinD extra startup time)
        run: |
          go build ./... && go vet ./...
          CGO_ENABLED=0 GOOS=linux go build \
            -trimpath \
            -ldflags="-s -w" \
            -o azimuthal \
            ./cmd/server

      - name: Wait for Docker daemon
        run: |
          for i in $(seq 1 90); do
            docker info >/dev/null 2>&1 && echo "Docker daemon ready after $((i*2))s" && break
            sleep 2
          done
          docker info
          echo "Sleeping 30s for DinD bridge networking to settle..."
          sleep 30

      # Dockerfile.ci only needs distroless (GCR) + postgres (Docker Hub).
      # golang/node no longer needed — binary pre-built above.
      - name: Pull container images (with retry)
        run: |
          for img in postgres:16-alpine gcr.io/distroless/static:nonroot; do
            echo "=== Pulling $img ==="
            for attempt in $(seq 1 10); do
              docker pull "$img" && echo "✅ Pulled $img" && break
              echo "Pull attempt $attempt/10 failed, retrying in 30s..."
              sleep 30
              [ "$attempt" = "10" ] && echo "❌ Failed to pull $img after 10 attempts" && exit 1
            done
          done

      - name: Start postgres
        run: |
          docker run -d --name postgres \
            -p 5433:5432 \
            -e POSTGRES_USER=azimuthal_test \
            -e POSTGRES_PASSWORD=testpassword \
            -e POSTGRES_DB=azimuthal_test \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U azimuthal_test 2>/dev/null && \
              echo "postgres ready after $((i*2))s" && break
            sleep 2
          done
          for retry in $(seq 1 5); do
            docker exec postgres pg_isready -U azimuthal_test && break
            [ "$retry" = "5" ] && echo "❌ postgres never became ready" && exit 1
            sleep 2
          done

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.BINARY_NAME }}:boot-${{ github.sha }} \
            -f build/Dockerfile.ci \
            .

      - name: Run image and wait for /health
        run: |
          docker run -d \
            --name azimuthal-boot \
            --network host \
            -e DATABASE_URL=postgres://azimuthal_test:testpassword@localhost:5433/azimuthal_test?sslmode=disable \
            -e JWT_SECRET=ci-docker-boot-secret-32-chars-min \
            -e STORAGE_ENDPOINT=http://localhost:9001 \
            -e STORAGE_ACCESS_KEY=minioadmin \
            -e STORAGE_SECRET_KEY=minioadmin \
            -e STORAGE_BUCKET=azimuthal-test \
            -e APP_ENV=test \
            -e APP_PORT=8080 \
            ${{ env.BINARY_NAME }}:boot-${{ github.sha }}

          deadline=$((SECONDS + 60))
          until curl -fsS http://localhost:8080/health > /dev/null 2>&1; do
            if [ $SECONDS -ge $deadline ]; then
              echo "❌ /health did not return 200 within 60s"
              docker logs azimuthal-boot || true
              exit 1
            fi
            sleep 2
          done
          echo "✅ /health returned 200"

      - name: Frontend bundle is served at /
        run: |
          BODY=$(curl -fsS http://localhost:8080/)
          # Vite emits <script type="module" crossorigin src="/assets/...">; allow
          # any attributes between "module" and the src=/assets/ marker.
          echo "$BODY" | grep -Eq 'type="module"[^>]*src="/assets/' \
            || (echo "❌ root response missing compiled JS bundle marker"; echo "$BODY" | head -40; exit 1)
          echo "✅ root serves a compiled JS bundle"

      - name: API health endpoint returns JSON
        run: |
          CT=$(curl -fsS -o /dev/null -w '%{content_type}' http://localhost:8080/health)
          echo "$CT" | grep -q "application/json" \
            || (echo "❌ /health Content-Type is $CT, expected application/json"; exit 1)
          echo "✅ /health returns application/json"

      - name: Tear down image
        if: always()
        run: |
          docker stop azimuthal-boot || true
          docker rm azimuthal-boot || true
          docker rmi ${{ env.BINARY_NAME }}:boot-${{ github.sha }} || true


  # ─────────────────────────────────────────────────────────────
  # FINAL GATE
  # ─────────────────────────────────────────────────────────────
  all-checks:
    name: All Gates Passed
    needs: [build, test, lint, sast, vuln-scan, secret-scan, container-scan, e2e, docs-check, docker-e2e]
    runs-on: azimuthal
    if: always()
    steps:
      - name: Check all gates
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more pipeline gates failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "⚠️ One or more pipeline gates were cancelled"
            exit 1
          fi
          echo "✅ All gates passed — safe to merge"
