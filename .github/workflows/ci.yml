name: CI

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci4-${{ github.ref }}
  cancel-in-progress: true


env:
  GO_VERSION: '1.26.5'
  NODE_VERSION: '20'
  POSTGRES_VERSION: '16'
  BINARY_NAME: azimuthal

  # Tool versions are pinned, and the pin IS the cache key.
  #
  # gosec and gitleaks were already pinned and cached. govulncheck and swag were
  # installed with `@latest` on every run, which is the one genuinely unsound
  # cache key this file had: the thing the key names can change without the key
  # changing. Bumping a pin here changes the key, which is the point.
  #
  # Note what this does NOT pin: govulncheck fetches the vulnerability database
  # at scan time, so the gate still sees today's advisories. Only the analyser
  # is pinned, exactly as gosec already was.
  GOSEC_VERSION: 'v2.26.1'
  GITLEAKS_VERSION: '8.21.2'
  GOVULNCHECK_VERSION: 'v1.6.0'
  SWAG_VERSION: 'v2.0.0-rc5'

jobs:

  # ─────────────────────────────────────────────────────────────
  # GATE 0: Detect changed paths
  #
  # Documentation-only pull requests skip the expensive gates. The
  # definition of "documentation-only" is: every changed file matches
  #
  #     docs/**  OR  **/*.md
  #
  # with one exception: docs/api/openapi.yaml is GENERATED from handler
  # annotations — a change there means an API change and runs the full
  # pipeline.
  #
  # Mechanism: this job always runs, and every expensive job is gated on its
  # output. Most of them inherit the gate through `needs: build`, which carries
  # the `if:`; `test` carries its own copy because it no longer waits for build
  # (see the note on that job). A job skipped by an `if:` still reports a
  # (skipped) status, which satisfies branch-protection required checks.
  #
  # DO NOT convert this to workflow-level `paths-ignore`: if the workflow
  # never triggers, its required checks never report at all and branch
  # protection blocks the PR forever at "Expected — waiting for status".
  #
  # `secret-scan` deliberately has no `needs` and therefore ALWAYS runs —
  # a credential pastes into markdown as easily as into code.
  # ─────────────────────────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        run: |
          # Only pull requests may skip gates. Pushes to main/develop and
          # manual dispatches always run the full pipeline.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Event is '${{ github.event_name }}' — full pipeline."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # On pull_request, HEAD is the synthetic merge commit; its first
          # parent is the base branch tip, so this diff is exactly the set
          # of files the PR changes relative to the current base.
          CHANGED=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          if [ -z "$CHANGED" ]; then
            echo "Empty change set — treating as code (fail safe)."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docs_only=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/api/openapi.yaml)
                # Generated API spec — an API change, never documentation.
                echo "code:  $f (generated OpenAPI spec)"
                docs_only=false
                break
                ;;
              docs/*) echo "docs:  $f" ;;
              *.md)   echo "docs:  $f" ;;
              *)
                echo "code:  $f"
                docs_only=false
                break
                ;;
            esac
          done <<< "$CHANGED"

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Result: docs_only=$docs_only"


  # ─────────────────────────────────────────────────────────────
  # GATE 1: Build — and the one producer of the server binary
  #
  # This job used to compile a binary into /tmp and throw it away, while e2e,
  # docker-e2e and container-scan each built their own. Three jobs ran
  # `npm ci && npm run build`; four ran `go build ./... && go vet ./...`.
  #
  # Now it builds ONE linux binary with the real frontend embedded and hands it
  # to every consumer as a run artifact. An artifact is not a cache: it has no
  # key, it is produced by this run from this run's checkout, and it does not
  # outlive the run. There is no input under which it can be stale.
  #
  # One consequence worth stating plainly: container-scan used to scan a binary
  # built against a STUB frontend, so the bytes it scanned were not the bytes
  # that ship. It now scans the same binary docker-e2e boots.
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build
    needs: changes
    # Skipping build cascade-skips every job that `needs` it (lint, frontend,
    # sast, vuln-scan, container-scan, e2e, docs-check, docker-e2e). All of
    # them still report a skipped status, which satisfies required checks.
    # `test` carries its own copy of this condition; secret-scan does not
    # depend on build and always runs.
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # setup-node's cache holds npm's DOWNLOAD cache, not the installed tree.
      # This caches the tree, keyed on the lockfile that produced it.
      #
      # Exact match only — no restore-keys. A partial match would restore a
      # node_modules built from a DIFFERENT lockfile and then skip `npm ci`,
      # which is precisely the stale-cache false-green this pass exists to
      # avoid. A lockfile change must miss, and a miss simply runs npm ci.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: cd web && npm ci

      - name: Build frontend assets
        run: cd web && npm run build

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      # The one binary every downstream job uses. CGO_ENABLED=0 + GOOS=linux so
      # it runs unchanged inside gcr.io/distroless/static, and -trimpath
      # -ldflags="-s -w" to match what build/Dockerfile.ci expects. web/dist was
      # built above, so go:embed picks up the real bundle.
      - name: Build server binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o ${{ env.BINARY_NAME }} ./cmd/server

      - name: Vet
        run: go vet ./...

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: ${{ env.BINARY_NAME }}
          retention-days: 1
          if-no-files-found: error


  # ─────────────────────────────────────────────────────────────
  # GATE 2: Test
  #
  # `needs: changes`, not `needs: build`. This job consumes nothing build
  # produces — it compiles its own test binaries against a stub frontend — so
  # the edge only added build's duration to the front of the longest job in the
  # pipeline. It carries its own copy of the docs-only condition, so the fast
  # path behaves exactly as before.
  #
  # The trade: a PR that does not compile now burns this job instead of
  # cascade-skipping it. The tests fail on the same error a moment later, so
  # what is spent is runner minutes, not signal.
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # postgres + minio are started manually via docker (below) rather than a
    # services: block, so the Docker-wait/pull-retry steps stay portable across
    # GitHub-hosted and any future self-managed runners.
    env:
      DATABASE_URL: postgres://azimuthal_test:testpassword@localhost:5433/azimuthal_test?sslmode=disable
      STORAGE_ENDPOINT: http://localhost:9001
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: azimuthal-test
      APP_ENV: test
      # CGO_ENABLED is NOT set here — only go test -race needs it, set per-step below.
      # Setting it job-wide causes every go run/build to need gcc before it's installed.

    steps:
      - uses: actions/checkout@v4

      # cache: false, then both Go caches by hand.
      #
      # setup-go's built-in cache keys GOMODCACHE *and* GOCACHE on the go.sum
      # hash, so every Go job in this workflow shares one key. That is right for
      # the module cache and useless for this job's build cache: -race,
      # -covermode=atomic and -coverpkg each change the build-cache action ID,
      # so nothing another job compiled is reusable here — and this job never
      # got to write a cache of its own, because another job had already saved
      # that key.
      #
      # Staleness is not a hazard for either. Go's build cache is
      # content-addressed internally: a restored entry that does not match the
      # current source is simply not used. A loose restore-key therefore costs a
      # recompile and can never produce a wrong object.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: gomod-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Cache the race-instrumented Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: gobuild-race-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('**/*.go', 'go.sum') }}
          restore-keys: gobuild-race-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Create stub frontend dist (for go:embed)
        run: mkdir -p web/dist && echo '<!DOCTYPE html><html><body>stub</body></html>' > web/dist/index.html

      # The `go build ./... && go vet ./...` that used to sit here existed only
      # to give a DinD daemon time to start, and the build job already vets. It
      # warmed nothing for the -race compile below, because a non-race object is
      # not a race object.
      - name: Wait for Docker daemon
        run: |
          # On GitHub-hosted runners the daemon is up before the job starts, so
          # this returns immediately. The 30s settle below is for DinD-style
          # runners, where bridge networking comes up after the daemon and
          # `docker pull` fails without it. It now costs only the runners that
          # actually need it, instead of every run of every job.
          if docker info >/dev/null 2>&1; then
            echo "Docker daemon already up — no settle needed."
            exit 0
          fi
          echo "Docker daemon not ready — waiting..."
          for i in $(seq 1 90); do
            docker info >/dev/null 2>&1 && echo "Docker daemon ready after $((i*2))s" && break
            sleep 2
          done
          docker info
          echo "Daemon needed waiting — sleeping 30s for bridge networking to settle..."
          sleep 30

      # Pull images explicitly with retry BEFORE docker run.
      # docker run pulls synchronously and exits non-zero on pull failure.
      - name: Pull container images (with retry)
        run: |
          for img in postgres:16-alpine quay.io/minio/minio:latest; do
            echo "=== Pulling $img ==="
            for attempt in $(seq 1 10); do
              docker pull "$img" && echo "✅ Pulled $img" && break
              echo "Pull attempt $attempt/10 failed, retrying in 30s..."
              sleep 30
              [ "$attempt" = "10" ] && echo "❌ Failed to pull $img after 10 attempts" && exit 1
            done
          done

      - name: Start postgres
        run: |
          docker run -d --name postgres \
            -p 5433:5432 \
            -e POSTGRES_USER=azimuthal_test \
            -e POSTGRES_PASSWORD=testpassword \
            -e POSTGRES_DB=azimuthal_test \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U azimuthal_test 2>/dev/null && \
              echo "postgres ready after $((i*2))s" && break
            sleep 2
          done
          for retry in $(seq 1 5); do
            docker exec postgres pg_isready -U azimuthal_test && break
            [ "$retry" = "5" ] && echo "❌ postgres never became ready" && exit 1
            sleep 2
          done

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9001:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 15); do
            curl -sf http://localhost:9001/minio/health/live 2>/dev/null && \
              echo "MinIO ready after $((i*2))s" && break
            sleep 2
          done
          curl -sf http://localhost:9001/minio/health/live || \
            (echo "❌ MinIO never became ready" && exit 1)

      # Still required. testutil.NewTestDB no longer touches this database — it
      # clones a template into a database of its own — but internal/db,
      # internal/jobs and cmd/server each open DATABASE_URL directly and expect
      # a migrated schema there.
      - name: Run migrations
        run: go run ./cmd/migrate

      # -race requires CGO; ensure gcc is present on the minimal runner image.
      - name: Install C build tools (required for -race detector)
        run: |
          which gcc && gcc --version || \
            (sudo apt-get update -qq && sudo apt-get install -y -q build-essential)

      # -count=1 is load-bearing, and it is here because leaving it out produced
      # a hollow gate the first time this job had a warm build cache.
      #
      # Go caches TEST RESULTS in the same directory as compiled packages. On
      # the first run whose source hash matched a previously saved cache, this
      # step "passed" in three seconds without executing a single test: same
      # binary, same tracked environment, so Go replayed the recorded result.
      # That reasoning is sound for a pure function and wrong for this suite —
      # the postgres these tests run against is not an input Go can see, and a
      # green Test job that never opened a connection is worth nothing.
      #
      # -count=1 disables result caching only. The build cache above still does
      # its job, which is to avoid recompiling 51 race-instrumented binaries.
      # `make test-live` has always passed -count=1; CI simply never needed it
      # while its build cache was permanently cold.
      #
      # -p 1 stays, for a different reason than it was added for. Tests no
      # longer share one database, but internal/db's TestMigrateDown rolls the
      # SHARED schema at DATABASE_URL backward and forward again, and
      # internal/jobs and cmd/server read that same shared schema. Running those
      # packages concurrently is a real race — between test packages, where
      # -race would never see it.
      - name: Run tests with race detector
        env:
          CGO_ENABLED: "1"  # -race requires CGO; gcc installed in previous step
        run: |
          go test \
            -v \
            -race \
            -p 1 \
            -count=1 \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -coverpkg=./internal/... \
            -timeout=600s \
            ./... 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}

      - name: Upload test output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: test-output.txt
          retention-days: 3

      # 80 matches the spec's stated gate (v0.3 IA spec §2.8) — the pipeline
      # enforced 70 while the spec said 80; P1.5 aligned them. Rises to 85 at
      # the end of P5, per the same section.
      - name: Enforce minimum coverage (80%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below the 80% floor"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets minimum"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7


  # ─────────────────────────────────────────────────────────────
  # GATE 3: Lint
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create stub frontend dist (for go:embed)
        run: mkdir -p web/dist && echo '<!DOCTYPE html><html><body>stub</body></html>' > web/dist/index.html

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          args: --config=.golangci.yml --timeout=5m

      - name: Check go.sum is up to date
        run: |
          go mod tidy
          git diff --exit-code go.sum || \
            (echo "❌ go.sum out of date — run go mod tidy" && exit 1)


  # ─────────────────────────────────────────────────────────────
  # GATE 3B: Frontend — type-check and unit tests
  #
  # T1. The frontend's unit suite was local-only, and with it every drift
  # guard written as a vitest test: web/src/lib/no-direct-fetch.test.ts (the
  # ADR rule that all network access goes through lib/api.ts),
  # web/src/lib/codex/schema.test.ts and
  # web/src/components/codex/extensions/extensions.test.ts (the ADR-0012
  # editor-vocabulary equality, whose failure mode is silent data loss). A
  # guard nobody runs on a pull request guards nothing, so they run here.
  #
  # `npm run lint` joined this job in the eslint closing pass. It was left out
  # when the job was created because eslint did not pass on main — 48 errors,
  # and the only ways to gate on it that day were to fail every pull request or
  # to add a baseline file, which is the exemption ledger this project deletes
  # rather than writes. The errors are gone now (known-issues #17), so the gate
  # goes on. Where a rule was turned off instead of satisfied, it is off in
  # web/eslint.config.js as a scoped override with the file list and the reason
  # written next to it — visible in the config a reviewer reads, not hidden in a
  # generated ledger nobody re-reads.
  #
  # It costs about 8s and shares this job's node_modules, so it adds no new
  # checkout, no new install, and nothing to the critical path — `frontend` is
  # not the longest branch of the graph.
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: cd web && npm ci

      - name: Type-check
        run: cd web && npm run type-check

      # `eslint .` exits non-zero on any error. Do not add --max-warnings slack
      # and do not add a baseline file: see docs/known-issues.md #17.
      - name: Lint
        run: cd web && npm run lint

      - name: Unit tests
        run: cd web && npm run test:unit

  # ─────────────────────────────────────────────────────────────
  # GATE 4A: SAST
  # ─────────────────────────────────────────────────────────────
  sast:
    name: SAST
    needs: build
    runs-on: ubuntu-latest
    # Security scans gate the PUBLIC release only. Private is the dev
    # sandbox — we expect work-in-progress code that may not be clean yet.
    if: endsWith(github.repository, '/azimuthal')
    timeout-minutes: 40
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create stub frontend dist (for go:embed)
        run: mkdir -p web/dist && echo '<!DOCTYPE html><html><body>stub</body></html>' > web/dist/index.html

      # Cache the compiled gosec binary so we only compile once per version.
      # go install on a 200m-CPU runner takes 20+ min — the cache cuts it to ~1s.
      - name: Cache gosec binary
        id: gosec-cache
        uses: actions/cache@v4
        with:
          path: .gosec-bin
          key: gosec-linux-amd64-${{ env.GOSEC_VERSION }}

      - name: Install gosec
        if: steps.gosec-cache.outputs.cache-hit != 'true'
        run: GOBIN=$GITHUB_WORKSPACE/.gosec-bin go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}

      - name: Add gosec to PATH
        run: echo "$GITHUB_WORKSPACE/.gosec-bin" >> $GITHUB_PATH

      - name: Run gosec (SARIF output for Security tab)
        run: |
          gosec \
            -severity high \
            -confidence high \
            -exclude-dir=vendor \
            -fmt sarif \
            -out gosec-results.sarif \
            ./... || true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true  # requires GitHub Advanced Security; skip gracefully on free plans
        with:
          sarif_file: gosec-results.sarif
          category: gosec

      - name: Fail on HIGH+ findings
        run: |
          gosec \
            -severity high \
            -confidence high \
            -exclude-dir=vendor \
            ./...


  # ─────────────────────────────────────────────────────────────
  # GATE 4B: Dependency vulnerability scanning
  # ─────────────────────────────────────────────────────────────
  vuln-scan:
    name: Dependency Scan
    needs: build
    runs-on: ubuntu-latest
    # Security scans gate the PUBLIC release only.
    if: endsWith(github.repository, '/azimuthal')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create stub frontend dist (for go:embed)
        run: mkdir -p web/dist && echo '<!DOCTYPE html><html><body>stub</body></html>' > web/dist/index.html

      # Same shape as gosec above: pinned version, version-keyed cache. The
      # advisory database is still fetched live at scan time.
      - name: Cache govulncheck binary
        id: govulncheck-cache
        uses: actions/cache@v4
        with:
          path: .govulncheck-bin
          key: govulncheck-linux-amd64-${{ env.GOVULNCHECK_VERSION }}

      - name: Install govulncheck
        if: steps.govulncheck-cache.outputs.cache-hit != 'true'
        run: GOBIN=$GITHUB_WORKSPACE/.govulncheck-bin go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Add govulncheck to PATH
        run: echo "$GITHUB_WORKSPACE/.govulncheck-bin" >> $GITHUB_PATH

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Generate JSON vulnerability report
        if: always()
        run: govulncheck -json ./... > vuln-report.json || true

      - name: Upload vulnerability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vuln-report
          path: vuln-report.json
          retention-days: 7


  # ─────────────────────────────────────────────────────────────
  # GATE 4C: Secret scanning
  # ─────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    # Security scans gate the PUBLIC release only. Private is dev-sandbox;
    # in-progress work may legitimately have placeholder secrets, etc.
    if: endsWith(github.repository, '/azimuthal')
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Use the gitleaks CLI directly. The gitleaks-action wrapper requires
      # a paid license for org-owned repos (free for personal only); the
      # binary itself is fully open source under MIT.
      - name: Cache gitleaks binary
        id: gitleaks-cache
        uses: actions/cache@v4
        with:
          path: .gitleaks-bin
          key: gitleaks-linux-amd64-${{ env.GITLEAKS_VERSION }}

      - name: Install gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .gitleaks-bin
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C .gitleaks-bin gitleaks

      - name: Run gitleaks
        # --no-git: scan the working tree only, not git history. Without this
        # gitleaks scans every historical commit which can fail on secrets
        # that have since been stripped (e.g. internal scripts removed from
        # public-facing commits via push-public.sh).
        run: |
          ./.gitleaks-bin/gitleaks detect \
            --source=. \
            --no-git \
            --redact \
            --verbose \
            --no-banner \
            --exit-code=1 \
            --report-format=sarif \
            --report-path=gitleaks-results.sarif

      - name: Upload gitleaks SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks-results.sarif
          retention-days: 7


  # ─────────────────────────────────────────────────────────────
  # GATE 4D: Container scanning
  #
  # No Go and no Node here any more: the binary arrives from build, and the
  # image is a distroless COPY of it. What this scans is now byte-identical to
  # what docker-e2e boots, which was not true while it built its own binary
  # against a stub frontend.
  # ─────────────────────────────────────────────────────────────
  container-scan:
    name: Container Scan
    needs: build
    runs-on: ubuntu-latest
    # Security scans gate the PUBLIC release only.
    if: endsWith(github.repository, '/azimuthal')
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: server-binary

      # Artifacts travel as zips, and a zip does not carry the executable bit.
      - name: Restore the executable bit
        run: chmod +x ${{ env.BINARY_NAME }}

      - name: Wait for Docker daemon
        run: |
          if docker info >/dev/null 2>&1; then
            echo "Docker daemon already up — no settle needed."
            exit 0
          fi
          echo "Docker daemon not ready — waiting..."
          for i in $(seq 1 90); do
            docker info >/dev/null 2>&1 && echo "Docker ready after $((i*2))s" && break
            sleep 2
          done
          docker info
          echo "Daemon needed waiting — sleeping 30s for bridge networking to settle..."
          sleep 30

      # Dockerfile.ci only needs distroless (GCR, no rate limit) — no Docker Hub pulls.
      - name: Pull distroless base image (with retry)
        run: |
          for attempt in $(seq 1 10); do
            docker pull gcr.io/distroless/static:nonroot && echo "✅ Pulled distroless" && break
            echo "Pull attempt $attempt/10 failed, retrying in 30s..."
            sleep 30
            [ "$attempt" = "10" ] && echo "❌ Failed to pull distroless after 10 attempts" && exit 1
          done

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.BINARY_NAME }}:scan-${{ github.sha }} \
            -f build/Dockerfile.ci \
            .

      - name: Run Trivy (SARIF output)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BINARY_NAME }}:scan-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true  # requires GitHub Advanced Security; skip gracefully on free plans
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Fail on HIGH/CRITICAL findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BINARY_NAME }}:scan-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library

      - name: Clean up image
        if: always()
        run: docker rmi ${{ env.BINARY_NAME }}:scan-${{ github.sha }} || true


  # ─────────────────────────────────────────────────────────────
  # GATE 5: E2E Tests
  #
  # `needs: build` only. This job used to declare `needs: [build, test]` and
  # consume nothing whatsoever from test — no downloaded artifact, no shared
  # state, its own postgres, its own minio, its own migrations, its own binary.
  # That one edge put 869s of unit tests in front of 332s of E2E on the
  # critical path.
  #
  # The `needs: build` edge is real now: the server this drives IS the artifact
  # build produced, rather than a fourth rebuild of it.
  # ─────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    needs: build
    runs-on: ubuntu-latest
    # No services: block — postgres + minio started manually after Docker-wait
    env:
      DATABASE_URL: postgres://azimuthal_test:testpassword@localhost:5433/azimuthal_test?sslmode=disable
      STORAGE_ENDPOINT: http://localhost:9001
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: azimuthal-test
      APP_ENV: test
      APP_PORT: "8082"
      BASE_URL: http://localhost:8082
      AZIMUTHAL_BINARY: /tmp/azimuthal-test

    steps:
      - uses: actions/checkout@v4

      # Go is still here for `go run ./cmd/migrate` below. The server migrates
      # on boot as well, but the explicit run has the database ready before
      # Playwright's webServer starts, rather than leaving the first
      # `admin create-user` to race the health probe.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: server-binary
          path: /tmp/e2e-bin

      - name: Install the server binary
        run: |
          install -m 0755 /tmp/e2e-bin/${{ env.BINARY_NAME }} /tmp/azimuthal-test
          /tmp/azimuthal-test --help >/dev/null

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ hashFiles('web/package-lock.json') }}

      # node_modules is needed for Playwright itself. `npm run build` is NOT:
      # the frontend is already inside the binary downloaded above.
      - name: Install frontend dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: cd web && npm ci

      - name: Wait for Docker daemon
        run: |
          if docker info >/dev/null 2>&1; then
            echo "Docker daemon already up — no settle needed."
            exit 0
          fi
          echo "Docker daemon not ready — waiting..."
          for i in $(seq 1 90); do
            docker info >/dev/null 2>&1 && echo "Docker daemon ready after $((i*2))s" && break
            sleep 2
          done
          docker info
          echo "Daemon needed waiting — sleeping 30s for bridge networking to settle..."
          sleep 30

      - name: Pull container images (with retry)
        run: |
          for img in postgres:16-alpine quay.io/minio/minio:latest; do
            echo "=== Pulling $img ==="
            for attempt in $(seq 1 10); do
              docker pull "$img" && echo "✅ Pulled $img" && break
              echo "Pull attempt $attempt/10 failed, retrying in 30s..."
              sleep 30
              [ "$attempt" = "10" ] && echo "❌ Failed to pull $img after 10 attempts" && exit 1
            done
          done

      - name: Start postgres
        run: |
          docker run -d --name postgres \
            -p 5433:5432 \
            -e POSTGRES_USER=azimuthal_test \
            -e POSTGRES_PASSWORD=testpassword \
            -e POSTGRES_DB=azimuthal_test \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U azimuthal_test 2>/dev/null && \
              echo "postgres ready after $((i*2))s" && break
            sleep 2
          done
          for retry in $(seq 1 5); do
            docker exec postgres pg_isready -U azimuthal_test && break
            [ "$retry" = "5" ] && echo "❌ postgres never became ready" && exit 1
            sleep 2
          done

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9001:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 15); do
            curl -sf http://localhost:9001/minio/health/live 2>/dev/null && \
              echo "MinIO ready after $((i*2))s" && break
            sleep 2
          done
          curl -sf http://localhost:9001/minio/health/live || \
            (echo "❌ MinIO never became ready" && exit 1)

      - name: Run migrations
        run: go run ./cmd/migrate

      # Pre-install OS deps once via apt (cached as system state on the
      # runner image). Avoids `playwright install --with-deps` which runs
      # `apt-get update && apt-get install` of ~30 packages every single
      # CI run, frequently hanging 25+ min on slow Debian mirrors.
      - name: Install Playwright system deps (one-time)
        run: |
          which apt-get >/dev/null 2>&1 || { echo "no apt — assuming deps present"; exit 0; }
          # Only the actual chromium runtime libs Playwright needs
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
            libatspi2.0-0t64 libdbus-1-3 libxext6 libx11-6 libxcb1 libglib2.0-0t64
        timeout-minutes: 5

      # Keyed on the exact @playwright/test version from the lockfile, because a
      # browser build is only valid for the Playwright that expects it — a
      # mismatched pair is precisely the failure this key exists to prevent, and
      # a lockfile hash would churn the cache on every unrelated bump.
      - name: Resolve the pinned Playwright version
        id: playwright
        run: |
          VERSION=$(node -p "require('./web/package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "Playwright pinned at $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Deliberately unconditional, cache hit or not. `playwright install`
      # checks what is on disk against what this version needs and downloads
      # only what is missing, so a cache that is somehow wrong gets corrected
      # rather than trusted. On a hit it costs a couple of seconds.
      - name: Install Playwright browsers (no --with-deps)
        run: cd web && npx playwright install chromium
        timeout-minutes: 5

      - name: Run E2E tests
        run: cd web && npx playwright test --reporter=list
        timeout-minutes: 10
        env:
          BASE_URL: http://localhost:8082
          AZIMUTHAL_BINARY: /tmp/azimuthal-test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Upload test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 3


  # ─────────────────────────────────────────────────────────────
  # GATE 6: API Docs Check
  # ─────────────────────────────────────────────────────────────
  docs-check:
    name: API Docs Check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create stub frontend dist (for go:embed)
        run: mkdir -p web/dist && echo '<!DOCTYPE html><html><body>stub</body></html>' > web/dist/index.html

      # Pinned and cached for the same reason as gosec and govulncheck, and it
      # matters more here than anywhere else: `make docs-check` regenerates the
      # spec and diffs it against the committed file, so the generator's version
      # is part of the expected output. Under `@latest`, a swag release could
      # fail this gate on a pull request that changed nothing at all.
      - name: Cache swag binary
        id: swag-cache
        uses: actions/cache@v4
        with:
          path: .swag-bin
          key: swag-linux-amd64-${{ env.SWAG_VERSION }}

      - name: Install swag
        if: steps.swag-cache.outputs.cache-hit != 'true'
        run: GOBIN=$GITHUB_WORKSPACE/.swag-bin go install github.com/swaggo/swag/v2/cmd/swag@${{ env.SWAG_VERSION }}

      - name: Add swag to PATH
        run: echo "$GITHUB_WORKSPACE/.swag-bin" >> $GITHUB_PATH

      # T1. This is the check that matters, and until now it existed only as a
      # local Makefile target. What ran here was a grep for four structural
      # markers — `openapi: 3`, `info:`, `title:`, `BearerAuth:` — plus two
      # path names, and it would have passed a spec that had lost every other
      # endpoint in the API. `make docs-check` regenerates from the handler
      # annotations and diffs, which is the only thing that can tell a stale
      # spec from a current one.
      - name: Regenerate the spec and diff it
        run: make docs-check

      # Kept, and now as a floor under the real check rather than a substitute
      # for it: it is the one thing that still catches a regeneration which
      # succeeds while producing something structurally wrong.
      - name: Validate OpenAPI 3.0 structure
        run: |
          SPEC=docs/api/openapi.yaml
          ERRORS=0

          # Must be OpenAPI 3.x
          grep -q "^openapi: 3" "$SPEC" \
            || { echo "❌ Not OAS3 — missing 'openapi: 3.x' at root"; ERRORS=$((ERRORS+1)); }

          # Must have non-empty title and version under info:
          grep -q "^info:" "$SPEC" \
            || { echo "❌ Missing info: block"; ERRORS=$((ERRORS+1)); }
          grep -q "title:" "$SPEC" \
            || { echo "❌ info.title missing"; ERRORS=$((ERRORS+1)); }
          grep -q "version:" "$SPEC" \
            || { echo "❌ info.version missing"; ERRORS=$((ERRORS+1)); }

          # Must have BearerAuth security scheme
          grep -q "BearerAuth:" "$SPEC" \
            || { echo "❌ BearerAuth not found in securitySchemes"; ERRORS=$((ERRORS+1)); }

          # Must have required paths
          grep -q "/auth/login:" "$SPEC" \
            || { echo "❌ Required path missing: /auth/login"; ERRORS=$((ERRORS+1)); }
          grep -q "/auth/me:" "$SPEC" \
            || { echo "❌ Required path missing: /auth/me"; ERRORS=$((ERRORS+1)); }

          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ OpenAPI spec validation failed ($ERRORS errors)"
            exit 1
          fi

          VERSION=$(grep "^openapi:" "$SPEC" | awk '{print $2}')
          ENDPOINTS=$(grep -c "^  /" "$SPEC" || true)
          echo "✅ OpenAPI ${VERSION} spec valid (${ENDPOINTS} top-level paths)"


  # ─────────────────────────────────────────────────────────────
  # GATE 7: Docker image boots and serves the app
  # Audit ref: testing-audit.md §7.3 — would have caught v0.1.1 directly.
  #
  # No Go and no Node here either. The bundle assertion below is exactly why
  # the shared artifact must be built against the real frontend rather than the
  # stub: this job is what proves the shipped binary has one embedded.
  # ─────────────────────────────────────────────────────────────
  docker-e2e:
    name: Docker image boot
    needs: build
    runs-on: ubuntu-latest
    # No services: block — postgres started manually after Docker-wait

    steps:
      - uses: actions/checkout@v4

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: server-binary

      - name: Restore the executable bit
        run: chmod +x ${{ env.BINARY_NAME }}

      - name: Wait for Docker daemon
        run: |
          if docker info >/dev/null 2>&1; then
            echo "Docker daemon already up — no settle needed."
            exit 0
          fi
          echo "Docker daemon not ready — waiting..."
          for i in $(seq 1 90); do
            docker info >/dev/null 2>&1 && echo "Docker ready after $((i*2))s" && break
            sleep 2
          done
          docker info
          echo "Daemon needed waiting — sleeping 30s for bridge networking to settle..."
          sleep 30

      # Dockerfile.ci only needs distroless (GCR) + postgres (Docker Hub).
      # golang/node no longer needed — the binary comes from the build job.
      - name: Pull container images (with retry)
        run: |
          for img in postgres:16-alpine gcr.io/distroless/static:nonroot; do
            echo "=== Pulling $img ==="
            for attempt in $(seq 1 10); do
              docker pull "$img" && echo "✅ Pulled $img" && break
              echo "Pull attempt $attempt/10 failed, retrying in 30s..."
              sleep 30
              [ "$attempt" = "10" ] && echo "❌ Failed to pull $img after 10 attempts" && exit 1
            done
          done

      - name: Start postgres
        run: |
          docker run -d --name postgres \
            -p 5433:5432 \
            -e POSTGRES_USER=azimuthal_test \
            -e POSTGRES_PASSWORD=testpassword \
            -e POSTGRES_DB=azimuthal_test \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U azimuthal_test 2>/dev/null && \
              echo "postgres ready after $((i*2))s" && break
            sleep 2
          done
          for retry in $(seq 1 5); do
            docker exec postgres pg_isready -U azimuthal_test && break
            [ "$retry" = "5" ] && echo "❌ postgres never became ready" && exit 1
            sleep 2
          done

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.BINARY_NAME }}:boot-${{ github.sha }} \
            -f build/Dockerfile.ci \
            .

      - name: Run image and wait for /health
        run: |
          docker run -d \
            --name azimuthal-boot \
            --network host \
            -e DATABASE_URL=postgres://azimuthal_test:testpassword@localhost:5433/azimuthal_test?sslmode=disable \
            -e STORAGE_ENDPOINT=http://localhost:9001 \
            -e STORAGE_ACCESS_KEY=minioadmin \
            -e STORAGE_SECRET_KEY=minioadmin \
            -e STORAGE_BUCKET=azimuthal-test \
            -e APP_ENV=test \
            -e APP_PORT=8080 \
            ${{ env.BINARY_NAME }}:boot-${{ github.sha }}

          deadline=$((SECONDS + 60))
          until curl -fsS http://localhost:8080/health > /dev/null 2>&1; do
            if [ $SECONDS -ge $deadline ]; then
              echo "❌ /health did not return 200 within 60s"
              docker logs azimuthal-boot || true
              exit 1
            fi
            sleep 2
          done
          echo "✅ /health returned 200"

      - name: Frontend bundle is served at /
        run: |
          BODY=$(curl -fsS http://localhost:8080/)
          # Vite emits <script type="module" crossorigin src="/assets/...">; allow
          # any attributes between "module" and the src=/assets/ marker.
          echo "$BODY" | grep -Eq 'type="module"[^>]*src="/assets/' \
            || (echo "❌ root response missing compiled JS bundle marker"; echo "$BODY" | head -40; exit 1)
          echo "✅ root serves a compiled JS bundle"

      - name: API health endpoint returns JSON
        run: |
          CT=$(curl -fsS -o /dev/null -w '%{content_type}' http://localhost:8080/health)
          echo "$CT" | grep -q "application/json" \
            || (echo "❌ /health Content-Type is $CT, expected application/json"; exit 1)
          echo "✅ /health returns application/json"

      - name: Tear down image
        if: always()
        run: |
          docker stop azimuthal-boot || true
          docker rm azimuthal-boot || true
          docker rmi ${{ env.BINARY_NAME }}:boot-${{ github.sha }} || true


  # ─────────────────────────────────────────────────────────────
  # FINAL GATE
  # ─────────────────────────────────────────────────────────────
  all-checks:
    name: All Gates Passed
    # `changes` is listed so a failed path-detection job fails this gate —
    # otherwise a broken detection job would skip every gate and still merge.
    # Skipped results (docs-only PRs) are not failures and pass this gate.
    needs: [changes, build, test, lint, frontend, sast, vuln-scan, secret-scan, container-scan, e2e, docs-check, docker-e2e]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all gates
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more pipeline gates failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "⚠️ One or more pipeline gates were cancelled"
            exit 1
          fi
          echo "✅ All gates passed — safe to merge"
