name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # e.g. v1.2.3

env:
  GO_VERSION: '1.26'
  REGISTRY: ghcr.io
  IMAGE_NAME: azimuthal-hq/azimuthal
  BINARY_NAME: azimuthal

jobs:

  build-release:
    name: Build Release Binaries
    runs-on: azimuthal
    if: endsWith(github.repository, '/azimuthal')
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe

    steps:
      - uses: actions/checkout@v4
 
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build frontend assets
        run: cd web && npm ci && npm run build
 
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w \
              -X main.Version=${{ env.VERSION }} \
              -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ${{ env.BINARY_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext || '' }} \
            ./cmd/server
 
      - name: Generate checksum
        run: |
          sha256sum \
            ${{ env.BINARY_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext || '' }} \
            > ${{ env.BINARY_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}.sha256
 
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 1
 
  docker-release:
    name: Build & Push to GHCR
    runs-on: azimuthal
    if: endsWith(github.repository, '/azimuthal')
    permissions:
      contents: read
      packages: write
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      # Self-hosted DinD sidecar can take 10-180s to be ready. Wait before
      # setup-buildx (which immediately requires a working daemon socket).
      - name: Wait for Docker daemon
        run: |
          for i in $(seq 1 90); do
            docker info >/dev/null 2>&1 && echo "Docker daemon ready after $((i*2))s" && break
            sleep 2
          done
          docker info
          echo "Sleeping 30s for DinD bridge networking to settle..."
          sleep 30

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
 
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: VERSION=${{ env.VERSION }}
 
  create-release:
    name: Create GitHub Release
    needs: [build-release, docker-release]
    runs-on: azimuthal
    if: endsWith(github.repository, '/azimuthal')
    permissions:
      contents: write
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
 
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
 
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Azimuthal ${{ env.VERSION }}
          generate_release_notes: true
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: ${{ env.BINARY_NAME }}-*
          body: |
            ## Azimuthal ${{ env.VERSION }}

            The self-hostable, open-source alternative to Jira, Confluence,
            and Jira Service Desk. Know exactly where your team is headed.

            **Free and open source for everyone — every feature, no tiers.**
            Apache 2.0 licensed.

            ---

            ## Choose your install path

            Pick the option that matches your environment. Each path below is
            self-contained — you don't need to read any other docs to get
            running. After install, jump to **First-Run: Create an Admin User**
            below before logging in.

            ### Option 1 — Docker Compose (recommended for self-hosting)

            Brings up Azimuthal + PostgreSQL + MinIO with healthchecks and
            persistent volumes. One command, one file.

            ```bash
            # 1. Grab the compose file and env template
            curl -O https://raw.githubusercontent.com/Azimuthal-HQ/azimuthal/main/build/docker-compose.yml
            curl -O https://raw.githubusercontent.com/Azimuthal-HQ/azimuthal/main/.env.example

            # 2. Create your env and fill in secrets
            cp .env.example .env

            # 3. Generate a secure JWT secret (64 hex chars) and pick passwords
            sed -i "s/change-me-run-openssl-rand-hex-32/$(openssl rand -hex 32)/" .env
            #   Then edit .env and set:
            #     POSTGRES_PASSWORD=...      # database password
            #     MINIO_ROOT_USER=...        # storage access key (e.g. azimuthal)
            #     MINIO_ROOT_PASSWORD=...    # storage secret key (16+ chars)
            #     AZIMUTHAL_VERSION=${{ env.VERSION }}

            # 4. Start everything
            docker compose -f docker-compose.yml up -d

            # 5. (Optional) Watch logs while it boots
            docker compose logs -f app
            ```

            ### Option 2 — Single Docker container (bring your own Postgres + S3/MinIO)

            For when you already have a managed database and object store.

            ```bash
            docker run -d \
              --name azimuthal \
              -p 8080:8080 \
              -e DATABASE_URL='postgres://USER:PASS@DBHOST:5432/azimuthal?sslmode=require' \
              -e JWT_SECRET="$(openssl rand -hex 32)" \
              -e STORAGE_ENDPOINT='https://s3.us-east-1.amazonaws.com' \
              -e STORAGE_ACCESS_KEY='AKIA...' \
              -e STORAGE_SECRET_KEY='...' \
              -e STORAGE_BUCKET='azimuthal-prod' \
              -e APP_ENV=production \
              -e APP_BASE_URL='https://azimuthal.your-domain.com' \
              ghcr.io/azimuthal-hq/azimuthal:${{ env.VERSION }}
            ```

            ### Option 3 — Single binary, no container (bare metal or VM)

            Static binary for Linux/macOS/Windows — no runtime deps.

            ```bash
            # 1. Pick your platform
            curl -LO https://github.com/Azimuthal-HQ/azimuthal/releases/download/${{ env.VERSION }}/azimuthal-linux-amd64
            chmod +x azimuthal-linux-amd64

            # 2. Verify checksum
            curl -LO https://github.com/Azimuthal-HQ/azimuthal/releases/download/${{ env.VERSION }}/azimuthal-linux-amd64.sha256
            sha256sum -c azimuthal-linux-amd64.sha256

            # 3. Set required env + start. The binary embeds the frontend —
            #    nothing else to install.
            export DATABASE_URL='postgres://USER:PASS@HOST:5432/azimuthal?sslmode=require'
            export JWT_SECRET="$(openssl rand -hex 32)"
            export STORAGE_ENDPOINT='http://localhost:9000'
            export STORAGE_ACCESS_KEY='minioadmin'
            export STORAGE_SECRET_KEY='your-minio-password'
            export STORAGE_BUCKET='azimuthal'
            export APP_BASE_URL='http://localhost:8080'

            ./azimuthal-linux-amd64 serve
            ```

            ---

            ## Setting up PostgreSQL (Options 2 & 3)

            If you're not using Compose, create the database and a least-privileged
            user before pointing Azimuthal at it. Migrations run automatically on
            first start.

            ```bash
            # Connect to your postgres as a superuser
            psql -h DBHOST -U postgres

            # Inside psql:
            CREATE USER azimuthal WITH PASSWORD 'pick-a-strong-password';
            CREATE DATABASE azimuthal OWNER azimuthal;
            \q
            ```

            Then your `DATABASE_URL` is:
            `postgres://azimuthal:pick-a-strong-password@DBHOST:5432/azimuthal?sslmode=require`

            ## Setting up MinIO (Options 2 & 3, if not using S3)

            ```bash
            docker run -d \
              --name azimuthal-minio \
              -p 9000:9000 -p 9001:9001 \
              -v minio-data:/data \
              -e MINIO_ROOT_USER='azimuthal' \
              -e MINIO_ROOT_PASSWORD='pick-a-strong-16-char-password' \
              minio/minio server /data --console-address ':9001'

            # Create the bucket (one-time)
            docker exec azimuthal-minio mc alias set local http://localhost:9000 azimuthal pick-a-strong-16-char-password
            docker exec azimuthal-minio mc mb local/azimuthal
            ```

            ---

            ## First-Run: Create an Admin User

            **Required** before you can log in. Azimuthal does not ship with a
            default account — you create the first one via CLI.

            **Compose:**
            ```bash
            docker compose exec app /azimuthal admin create-user \
              --email admin@example.com \
              --name "Admin" \
              --password 'pick-a-strong-password'
            ```

            **Single Docker container:**
            ```bash
            docker exec azimuthal /azimuthal admin create-user \
              --email admin@example.com \
              --name "Admin" \
              --password 'pick-a-strong-password'
            ```

            **Single binary:**
            ```bash
            ./azimuthal-linux-amd64 admin create-user \
              --email admin@example.com \
              --name "Admin" \
              --password 'pick-a-strong-password'
            ```

            All three paths use the same `DATABASE_URL` env you set above. Each
            invocation also auto-creates a personal organization for the user
            and grants owner role.

            > **Change the password from the UI immediately after first login.**

            ## Reset a forgotten password

            ```bash
            docker compose exec app /azimuthal admin reset-password \
              --email admin@example.com \
              --password 'new-strong-password'
            ```

            ---

            ## Required environment variables

            | Variable | What it is |
            |---|---|
            | `DATABASE_URL` | Full Postgres DSN, e.g. `postgres://user:pass@host:5432/azimuthal?sslmode=require` |
            | `JWT_SECRET` | 64-char hex secret for signing tokens. Generate: `openssl rand -hex 32` |
            | `STORAGE_ENDPOINT` | S3-compatible URL (S3, MinIO, R2, etc.) |
            | `STORAGE_ACCESS_KEY` | Access key for the storage backend |
            | `STORAGE_SECRET_KEY` | Secret key for the storage backend |
            | `STORAGE_BUCKET` | Bucket name (created beforehand) |

            ### Common optional vars

            | Variable | Default | Use |
            |---|---|---|
            | `APP_PORT` | `8080` | HTTP port |
            | `APP_BASE_URL` | `http://localhost:8080` | Public URL — used in emails and external links |
            | `APP_ENV` | `production` | `development` / `test` / `production` |
            | `JWT_EXPIRY` | `24h` | Access token lifetime (Go duration) |
            | `SMTP_HOST` / `SMTP_PORT` | `localhost` / `25` | Outbound email |
            | `LOG_LEVEL` | `info` | `debug` / `info` / `warn` / `error` |

            ---

            ## Verify your download

            ```bash
            sha256sum -c azimuthal-linux-amd64.sha256
            ```

            Each binary in this release ships with its matching `.sha256` file —
            verify before running on production hosts.
