  /orgs/{orgID}/spaces/{spaceID}/wiki/{pageID}/revisions/{version}/restore:
    post:
      description: 'Republishes the content of an earlier version as a NEW version
        — the history is never rewritten, so restoring version 3 onto a page at version
        7 produces version 8 and leaves 4 through 7 in place. It flows through the
        ordinary publish path and gets no exemption from its refusals: 409 with a
        conflict body when the page has been published past base_version, and 409
        with a lost-content body when the older version does not carry preserved content
        the current one does (ADR-0012 — that removal must be acknowledged, not inferred).
        Restoring the version the page already holds changes nothing and reports so
        rather than adding an empty version.'
      parameters:
      - description: Organization ID (UUID)
        in: path
        name: orgID
        required: true
        schema:
          type: string
      - description: Space ID (UUID)
        in: path
        name: spaceID
        required: true
        schema:
          type: string
      - description: Page ID (UUID)
        in: path
        name: pageID
        required: true
        schema:
          type: string
      - description: The version to restore
        in: path
        name: version
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - additionalProperties: {}
                title: body
                type: object
        description: Base version, and any acknowledged removals
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: The published page, or a no-op report
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Invalid ID or version
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: No such page or version
        "409":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Version conflict, or preserved content would be lost
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Unresolvable preserved content
      security:
      - BearerAuth: []
      summary: Restore an earlier version of a page
      tags:
      - wiki
