          type: integer
        created_at:
          type: string
        entity_id:
          type: string
        entity_kind:
          type: string
        id:
          type: string
        payload:
          items:
            type: integer
          type: array
          uniqueItems: false
        ticket_ref:
          type: string
      type: object
    admin.auditListResponse:
      properties:
        entries:
          items:
            $ref: '#/components/schemas/admin.auditEntryResponse'
          type: array
          uniqueItems: false
        next_cursor:
          description: |-
            NextCursor is "<rfc3339nano>,<uuid>" of the last row, empty when the
            page was not full.
          type: string
      type: object
    admin.bulkActionResponse:
      properties:
        action:
          type: string
        from_role:
          type: string
        space_id:
          type: string
        team_id:
          type: string
        to_role:
          type: string
      type: object
    admin.bulkApplyRequest:
      properties:
        changes:
          items:
            $ref: '#/components/schemas/admin.bulkChangeRequest'
          type: array
          uniqueItems: false
        ticket_ref:
          description: |-
            TicketRef is the operator reference recorded on every audit event of the
            batch. Free text, no foreign key. Optional by default; mandatory when
            the deployment sets AZIMUTHAL_TICKET_REF_REQUIRED.

            This is the one endpoint that carries the reference in the body rather
            than the ticket_ref query parameter — a shipped contract with clients
            already sending it. It shares the cap and the requirement rule with the
            query-parameter transport via ticketref.Policy.
          type: string
      type: object
    admin.bulkChangeRequest:
      properties:
        role:
          type: string
        space_id:
          type: string
        team_id:
          type: string
      type: object
    admin.bulkPreviewRequest:
      properties:
        changes:
          items:
            $ref: '#/components/schemas/admin.bulkChangeRequest'
          type: array
          uniqueItems: false
      type: object
    admin.bulkResultResponse:
      properties:
        actions:
          items:
            $ref: '#/components/schemas/admin.bulkActionResponse'
          type: array
          uniqueItems: false
        batch_id:
          type: string
        creates:
          type: integer
        noops:
          type: integer
        revokes:
          type: integer
        ticket_ref:
          description: |-
            TicketRef echoes the operator's free-text reference recorded on every
            audit event of this batch. Present on apply, absent on preview.
          type: string
        updates:
          type: integer
      type: object
