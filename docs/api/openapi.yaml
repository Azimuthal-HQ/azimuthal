components:
  schemas:
    access.Capability:
      description: Capability is set iff Kind is GuardActorHasCapability.
      enum:
      - read_items
      - read_aggregates
      - create_items
      - edit_own_items
      - comment
      - edit_any_item
      - transition_any_item
      - manage_queue
      - manage_space
      - manage_grants
      - manage_shares
      - manage_workflow
      - set_visibility
      type: string
      x-enum-varnames:
      - CapReadItems
      - CapReadAggregates
      - CapCreateItems
      - CapEditOwnItems
      - CapComment
      - CapEditAnyItem
      - CapTransitionAnyItem
      - CapManageQueue
      - CapManageSpace
      - CapManageGrants
      - CapManageShares
      - CapManageWorkflow
      - CapSetVisibility
    admin.auditEntryResponse:
      properties:
        action:
          type: string
