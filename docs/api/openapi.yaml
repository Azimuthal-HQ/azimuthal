          description: Columns in the order they appear on the board; position is
            the index.
          items:
            $ref: '#/components/schemas/projects.boardColumnRequest'
          type: array
          uniqueItems: false
      type: object
    spaces.BootConfig:
      properties:
        ticket_ref_required:
          description: |-
            TicketRefRequired mirrors AZIMUTHAL_TICKET_REF_REQUIRED. The UI marks
            its ticket-reference fields required and refuses to submit without one,
            so an operator meets the requirement before the request rather than
            after the 400.
          type: boolean
      type: object
    tickets.ticketRefSuggestion:
      properties:
        assigned_to_me:
          type: boolean
        number:
          type: integer
        ref:
          type: string
        space_id:
          type: string
        space_key:
          type: string
        status:
          type: string
        ticket_id:
          type: string
        title:
          type: string
      type: object
    workflow.Approval:
      properties:
        can_decide:
          description: |-
            CanDecide reports whether the CALLER may decide this request. It is
            resolved at read time against the caller's identity and effective teams,
            never stored, and it is the only way a client can know: approval
            authority is DATA — being named on the transition — so there is no
            capability for the frontend to consult and no way to compute it from the
            approval row alone.

            Not omitempty. False is the meaningful majority answer, and a client must
            be able to tell "you may not decide" from "this build did not say".
          type: boolean
        decided_at:
          type: string
        decided_by:
          type: string
        decided_by_name:
          description: DecidedByName is resolved at read time for display, never stored.
          type: string
        decision:
          $ref: '#/components/schemas/workflow.Decision'
        entity_id:
          type: string
        entity_type:
          $ref: '#/components/schemas/workflow.ApprovalEntityType'
        from_state_id:
          type: string
        from_status:
          type: string
        id:
          type: string
        reason:
          description: |-
            Reason is what the approver said about the decision (migration 050).

            It is REQUIRED on a decline and optional on an approval — see
            TierService.Decide. Nil on every pending request, and on rows written
            before migration 050 shipped, which is why the column is nullable and the
            "declines carry a reason" rule lives in Go rather than in a CHECK.
          type: string
        requested_at:
          type: string
        requested_by:
          type: string
        requested_by_name:
          description: RequestedByName is resolved at read time for display, never
            stored.
          type: string
        space_id:
          type: string
        to_state_id:
          type: string
        to_status:
          type: string
        transition_id:
          type: string
      type: object
    workflow.ApprovalEntityType:
      enum:
      - ticket
      - item
      type: string
      x-enum-varnames:
      - ApprovalEntityTicket
      - ApprovalEntityItem
    workflow.Approver:
      properties:
        id:
          type: string
        subject_id:
          type: string
        subject_missing:
          description: |-
            SubjectMissing marks an approver whose subject has been deleted — the
            same pair access.Grant carries, resolved the same way.
          type: boolean
        subject_name:
          description: |-
            SubjectName is resolved at read time for display, never stored. Empty
            when the subject no longer exists.
          type: string
        subject_type:
          $ref: '#/components/schemas/workflow.ApproverSubjectType'
        transition_id:
          type: string
      type: object
    workflow.ApproverSubjectType:
      enum:
      - user
      - team
      type: string
      x-enum-varnames:
      - ApproverUser
      - ApproverTeam
    workflow.Decision:
      enum:
      - approved
      - declined
      type: string
      x-enum-varnames:
      - DecisionApproved
      - DecisionDeclined
    workflow.FieldKey:
      description: FieldKey is set iff Kind is GuardFieldRequired.
      enum:
      - assignee_id
      - due_at
      - description
      - labels
      type: string
      x-enum-varnames:
      - FieldAssigneeID
      - FieldDueAt
      - FieldDescription
      - FieldLabels
    workflow.Guard:
      properties:
        capability:
          $ref: '#/components/schemas/access.Capability'
        field_key:
          $ref: '#/components/schemas/workflow.FieldKey'
        guard_class:
          $ref: '#/components/schemas/workflow.GuardClass'
        id:
          type: string
        kind:
          $ref: '#/components/schemas/workflow.GuardKind'
        position:
          type: integer
        team_id:
          description: |-
            TeamID is set iff Kind is GuardActorInTeam — except in the degraded
            state, where the team was deleted and the reference was SET NULL. A
            GuardActorInTeam with no TeamID is unsatisfiable by design; see
            Evaluate.
          type: string
        transition_id:
          type: string
      type: object
    workflow.GuardClass:
      enum:
      - condition
      - validator
      type: string
      x-enum-varnames:
      - GuardConditionClass
      - GuardValidatorClass
    workflow.GuardKind:
      enum:
      - actor_is_assignee
      - actor_in_team
      - actor_has_capability
      - field_required
      type: string
      x-enum-varnames:
      - GuardActorIsAssignee
      - GuardActorInTeam
      - GuardActorHasCapability
      - GuardFieldRequired
    workflow.Offer:
      properties:
        name:
          type: string
        requires_approval:
          description: |-
            RequiresApproval reports that taking this transition creates an approval
            request rather than moving the entity. The client says so before the
            click; without it the only honest UI is a button that sometimes answers
            202 for reasons the user cannot see.
          type: boolean
        to_state_id:
          type: string
        to_status:
          type: string
        transition_id:
          type: string
      type: object
    workflow.Offering:
      properties:
        current_status:
          description: |-
            CurrentStatus is where the workflow considers the entity to be, which is
            not always the entity's status text — see ResolveFromState.
          type: string
        entity_status:
          description: |-
            EntityStatus is the entity's stored status text, so a client can tell
            that the two have drifted rather than silently rendering the resolved one.
          type: string
        no_workflow:
          description: |-
            NoWorkflow reports that the space has no workflow, so this package can
            offer nothing and the client falls back to its own vocabulary. It is the
            read-side twin of Decision.NoWorkflow, and it exists so "no workflow" and
            "a workflow that offers nothing" are distinguishable — they are very
            different answers and collapsing them would strand the client.
          type: boolean
        transitions:
          description: |-
            Transitions are the moves the actor may be offered, conditions applied.
            Never nil; an empty list means the actor is offered nothing, which is a
            real answer.
          items:
            $ref: '#/components/schemas/workflow.Offer'
          type: array
          uniqueItems: false
      type: object
    workflow.PostFieldKey:
      description: FieldKey and FieldValue are meaningful iff Kind is PostSetField.
      enum:
      - due_at
      - labels
      type: string
      x-enum-varnames:
      - PostFieldDueAt
      - PostFieldLabels
    workflow.PostFunction:
      properties:
        assignee_user_id:
          description: |-
            AssigneeUserID is meaningful iff Kind is PostAssignTo. Nil means
            "unassign" — and also means "the configured user was deleted", because
            migration 046 collapses the two with ON DELETE SET NULL. Both outcomes
            remove an assignment rather than granting one, which is why the collapse
            is safe; see the migration header.
          type: string
        field_key:
          $ref: '#/components/schemas/workflow.PostFieldKey'
        field_value:
          type: string
        id:
          type: string
        kind:
          $ref: '#/components/schemas/workflow.PostFunctionKind'
        position:
          type: integer
        transition_id:
          type: string
      type: object
    workflow.PostFunctionKind:
      enum:
      - assign_to
      - set_field
      type: string
      x-enum-varnames:
      - PostAssignTo
      - PostSetField
    workflow.State:
      properties:
        category:
          description: '"todo", "in_progress", "done"'
          type: string
        color:
          type: string
        created_at:
          type: string
        id:
          type: string
        is_initial:
          type: boolean
        name:
          type: string
        position:
          type: integer
        workflow_id:
          type: string
      type: object
    workflow.Transition:
      properties:
        created_at:
          type: string
        from_state_id:
          type: string
        id:
          type: string
        name:
          type: string
        to_state_id:
          type: string
        workflow_id:
          type: string
      type: object
    workflow.Workflow:
      properties:
        applies_to:
          description: '"tickets", "project_items", "both"'
          type: string
        created_at:
          type: string
        description:
          type: string
        id:
          type: string
        is_default:
          type: boolean
        name:
          type: string
        org_id:
          type: string
        updated_at:
          type: string
      type: object
    workflows.createApproverRequest:
      properties:
        subject_id:
          type: string
        subject_type:
          type: string
      type: object
    workflows.createGuardRequest:
      properties:
        capability:
          type: string
        field_key:
          type: string
        guard_class:
          type: string
        kind:
          type: string
        position:
          type: integer
        team_id:
          type: string
      type: object
    workflows.createPostFunctionRequest:
      properties:
        assignee_user_id:
          type: string
        field_key:
          type: string
        field_value:
          type: string
        kind:
          type: string
        position:
          type: integer
      type: object
    workflows.createStateRequest:
      properties:
        category:
          type: string
        color:
          type: string
        is_initial:
          type: boolean
        name:
          type: string
        position:
          type: integer
      type: object
    workflows.createTransitionRequest:
      properties:
        from_state_id:
          type: string
        name:
          type: string
        to_state_id:
          type: string
      type: object
    workflows.createWorkflowRequest:
      properties:
        applies_to:
          type: string
        description:
          type: string
        is_default:
          type: boolean
        name:
          type: string
      type: object
    workflows.decideApprovalRequest:
      properties:
        decision:
          type: string
        reason:
          description: |-
            Reason is required when Decision is "declined" and optional otherwise.
            TierService.Decide owns the rule; see workflow.ErrDeclineReasonRequired.
          type: string
      type: object
    workflows.updateWorkflowRequest:
      properties:
        applies_to:
          type: string
        description:
          type: string
        is_default:
          type: boolean
        name:
          type: string
      type: object
    workflows.workflowTransitionRequest:
      properties:
        state_id:
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      description: 'Customer-portal session token. Format: "Bearer <token>". Obtained
        via POST /api/v1/portal/auth/redeem. NOT interchangeable with BearerAuth:
        the two token families carry different audience claims and each parser refuses
        the other''s tokens.'
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  contact:
    email: hello@azimuthalhq.com
    name: Azimuthal HQ
    url: https://azimuthalhq.com
  description: |-
    The fully open-source alternative to Jira, Confluence, and Jira Service Desk.
    Self-hostable, single binary, Apache 2.0 licensed.

    ## Authentication
    All endpoints except /auth/login and /auth/register require a Bearer JWT token.
    Obtain a token via POST /api/v1/auth/login, then include it as:
    `Authorization: Bearer <your-token>`
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Azimuthal API
  version: "1.0"
openapi: 3.1.0
paths:
  /auth/login:
    post:
      description: Validates email and password, returns JWT access/refresh tokens
        and user profile with primary org.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.SwaggerLoginRequest'
                description: Login credentials
                summary: body
        description: Login credentials
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerLoginResponse'
          description: Authenticated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Missing email or password
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Invalid credentials
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Internal error
      summary: Authenticate user
      tags:
      - auth
  /auth/logout:
    post:
      description: Deletes all sessions for the current user.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerLogoutResponse'
          description: Logged out
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not authenticated
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Internal error
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - auth
  /auth/me:
    get:
      description: Returns the profile of the currently authenticated user.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerUserResponse'
          description: User profile
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not authenticated
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Internal error
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
    patch:
      description: Updates the display name and email of the currently authenticated
        user.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/auth.updateMeRequest'
                description: Profile fields
                summary: body
        description: Profile fields
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerUserResponse'
          description: Updated profile
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Validation error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not authenticated
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Internal error
      security:
      - BearerAuth: []
      summary: Update current user
      tags:
      - auth
  /auth/me/avatar:
    put:
      description: Uploads the caller's own avatar. The image type is sniffed from
        the bytes server-side, never taken from the declared content type, and only
        PNG, JPEG, WebP and GIF are accepted. The object key is derived from the org
        and user ids.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              title: file
              type: file
          multipart/form-data:
            schema:
              type: object
        description: Image file (PNG, JPEG, WebP or GIF; 5 MiB maximum)
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/avatar.avatarResponse'
          description: The serve URL now recorded on the user
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: No file part, or an invalid organization on the token
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not authenticated
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Image exceeds the maximum size
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not a supported image type
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Internal error
      security:
      - BearerAuth: []
      summary: Set my avatar
      tags:
      - auth
  /auth/refresh:
    post:
      description: Exchanges a valid refresh token for a new access/refresh token
        pair.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.SwaggerRefreshRequest'
                description: Refresh token
                summary: body
        description: Refresh token
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerRefreshResponse'
          description: New token pair
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Missing refresh_token
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Invalid or expired refresh token
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Internal error
      summary: Refresh tokens
      tags:
      - auth
  /auth/register:
    post:
      description: Creates a new user account with a personal organization, returns
        JWT tokens.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.SwaggerRegisterRequest'
                description: Registration details
                summary: body
        description: Registration details
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerLoginResponse'
