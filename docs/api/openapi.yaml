          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not found
      security:
      - BearerAuth: []
      summary: Delete an attachment (space)
      tags:
      - attachments
    get:
      description: 'Streams an attachment''s bytes for a space member. The Content-Type
        is SNIFFED from the stored bytes at serve time and the stored content_type
        is never echoed. PNG, JPEG, GIF, WebP and PDF are served inline with their
        sniffed type; every other type — including SVG, HTML and XML — is served as
        application/octet-stream with Content-Disposition: attachment, under its original
        filename.'
      parameters:
      - description: Organization ID (UUID)
        in: path
        name: orgID
        required: true
        schema:
          type: string
      - description: Space ID (UUID)
        in: path
        name: spaceID
        required: true
        schema:
          type: string
      - description: Attachment ID (UUID)
        in: path
        name: attachmentID
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                type: file
          description: Attachment bytes
          headers:
            Content-Disposition:
              description: inline for the allow-listed types, attachment otherwise;
                the stored filename is preserved either way
              schema:
                type: string
            Content-Type:
              description: Sniffed from the bytes; application/octet-stream unless
                the object is a PNG, JPEG, GIF, WebP or PDF
              schema:
                type: string
            X-Content-Type-Options:
              description: nosniff
              schema:
                type: string
        "404":
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not found
      security:
      - BearerAuth: []
      summary: Download an attachment (space)
      tags:
      - attachments
