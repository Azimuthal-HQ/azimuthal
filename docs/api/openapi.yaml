  /orgs/{orgID}/grants/bulk-apply:
    post:
      description: 'Applies the changes atomically: one transaction, one batch_id,
        one audit batch. A failure anywhere rolls back everything. Org admins only.'
      parameters:
      - description: Organization ID
        in: path
        name: orgID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/admin.bulkApplyRequest'
                description: Changes and the ticket_ref body field (max 200 chars;
                  may be mandatory — see AZIMUTHAL_TICKET_REF_REQUIRED). Unlike the
                  other administrative mutations this endpoint takes the reference
                  in the body, not the query string — a shipped contract.
                summary: body
        description: Changes and the ticket_ref body field (max 200 chars; may be
          mandatory — see AZIMUTHAL_TICKET_REF_REQUIRED). Unlike the other administrative
          mutations this endpoint takes the reference in the body, not the query string
          — a shipped contract.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin.bulkResultResponse'
          description: Applied diff with batch_id
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Validation error, including a missing or over-long ticket_ref
            — nothing applied
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not found (also returned to non-admins)
      security:
      - BearerAuth: []
      summary: Apply bulk grant changes (admin)
      tags:
      - admin
  /orgs/{orgID}/grants/bulk-preview:
    post:
      description: Computes the itemised diff (creates, role changes, revocations)
        the given changes would apply, using the same computation apply uses. Nothing
        is written. Org admins only.
      parameters:
      - description: Organization ID
        in: path
        name: orgID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/admin.bulkPreviewRequest'
                description: Requested cell states
                summary: body
        description: Requested cell states
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin.bulkResultResponse'
          description: The diff
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Validation error — the whole batch is rejected
        "404":
          content:
            application/json:
              schema:
