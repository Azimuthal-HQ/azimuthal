      properties:
        applies_to:
          type: string
        description:
          type: string
        is_default:
          type: boolean
        name:
          type: string
      type: object
    workflows.workflowTransitionRequest:
      properties:
        state_id:
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      description: 'JWT Bearer token. Format: "Bearer <token>". Obtain via POST /api/v1/auth/login'
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  contact:
    email: hello@azimuthalhq.com
    name: Azimuthal HQ
    url: https://azimuthalhq.com
  description: |-
    The fully open-source alternative to Jira, Confluence, and Jira Service Desk.
    Self-hostable, single binary, Apache 2.0 licensed.

    ## Authentication
    All endpoints except /auth/login and /auth/register require a Bearer JWT token.
    Obtain a token via POST /api/v1/auth/login, then include it as:
    `Authorization: Bearer <your-token>`
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Azimuthal API
  version: "1.0"
openapi: 3.1.0
paths:
  /auth/login:
    post:
      description: Validates email and password, returns JWT access/refresh tokens
        and user profile with primary org.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.SwaggerLoginRequest'
                description: Login credentials
                summary: body
        description: Login credentials
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerLoginResponse'
          description: Authenticated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Missing email or password
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Invalid credentials
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Internal error
      summary: Authenticate user
      tags:
      - auth
  /auth/logout:
    post:
      description: Deletes all sessions for the current user.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerLogoutResponse'
          description: Logged out
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not authenticated
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Internal error
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - auth
  /auth/me:
    get:
      description: Returns the profile of the currently authenticated user.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerUserResponse'
          description: User profile
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not authenticated
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Internal error
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
    patch:
      description: Updates the display name and email of the currently authenticated
        user.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/auth.updateMeRequest'
                description: Profile fields
                summary: body
        description: Profile fields
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerUserResponse'
          description: Updated profile
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Validation error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not authenticated
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Internal error
      security:
      - BearerAuth: []
      summary: Update current user
      tags:
      - auth
  /auth/refresh:
    post:
      description: Exchanges a valid refresh token for a new access/refresh token
        pair.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.SwaggerRefreshRequest'
                description: Refresh token
                summary: body
        description: Refresh token
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerRefreshResponse'
          description: New token pair
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Missing refresh_token
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Invalid or expired refresh token
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Internal error
      summary: Refresh tokens
      tags:
      - auth
  /auth/register:
    post:
      description: Creates a new user account with a personal organization, returns
        JWT tokens.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.SwaggerRegisterRequest'
                description: Registration details
                summary: body
        description: Registration details
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerLoginResponse'
          description: User created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Validation error
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Email already in use
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Internal error
      summary: Register new user
      tags:
      - auth
  /health:
    get:
      description: Returns {"status":"ok"} when the server is running. Includes queue
        status.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.healthResponse'
          description: Server is alive
      summary: Liveness probe
      tags:
      - health
  /invites/{token}:
    get:
      description: Returns whom the invite is for, the org, its state, and whether
        the email already has an account. Token-authenticated.
      parameters:
      - description: Raw invite token
        in: path
        name: token
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invites.inspectResponse'
          description: Invite details
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Unknown token
      summary: Inspect invite (public)
      tags:
      - auth
  /invites/accept:
    post:
      description: Consumes an invite transactionally. A new email gets an account
        (display_name and password required) and a token pair; an email with an existing
        account gets a membership added and signs in normally.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/invites.acceptRequest'
                description: Token, plus display_name and password for new accounts
                summary: body
        description: Token, plus display_name and password for new accounts
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invites.acceptResponse'
          description: Joined
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Validation error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Unknown token
        "410":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Invite expired, revoked, or already used
      summary: Accept invite (public)
      tags:
      - auth
  /notifications:
    get:
      description: Returns the authenticated user's notifications, unread first. Paginated
        via limit/offset query params.
      parameters:
      - description: Max results (default 20)
        in: query
        name: limit
        schema:
          type: integer
      - description: Offset for pagination
        in: query
        name: offset
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notifications.listNotificationsResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: List notifications
      tags:
      - notifications
  /notifications/{notificationID}/read:
    post:
      description: Marks the specified notification as read. Only the owning user
        can mark their own notifications.
      parameters:
      - description: Notification ID
        in: path
        name: notificationID
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Mark notification read
      tags:
      - notifications
  /notifications/read-all:
    post:
      description: Marks every unread notification for the authenticated user as read.
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Mark all notifications read
      tags:
      - notifications
  /orgs/{org_id}/access-matrix:
    get:
      description: Teams (tree, member counts), spaces, and every direct team grant,
        in a constant number of queries. Inherited access is derived client-side from
        team paths. Org admins only.
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin.matrixResponse'
          description: Matrix data
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not authenticated
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not found (also returned to non-admins)
      security:
      - BearerAuth: []
      summary: Access matrix (admin)
      tags:
      - admin
  /orgs/{org_id}/audit-log:
    get:
      description: Append-only audit events with filters for actor, entity kind, action,
        and date range. Events of one bulk batch collapse to a single row carrying
        batch_size; expand via the batches endpoint. Keyset cursor pagination. Org
        admins only.
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          type: string
      - description: Filter by actor
        in: query
        name: actor_id
        schema:
          type: string
      - description: Filter by entity kind
        in: query
        name: entity_kind
        schema:
          type: string
      - description: Filter by action
        in: query
        name: action
        schema:
          type: string
      - description: RFC 3339 lower bound
        in: query
        name: from
        schema:
          type: string
      - description: RFC 3339 upper bound
        in: query
        name: to
        schema:
          type: string
      - description: Keyset cursor from next_cursor
        in: query
        name: cursor
        schema:
          type: string
      - description: Page size (max 100, default 50)
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin.auditListResponse'
          description: One page
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Invalid filter
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not found (also returned to non-admins)
      security:
      - BearerAuth: []
      summary: Audit log (admin)
      tags:
      - admin
  /orgs/{org_id}/audit-log/batches/{batch_id}:
    get:
      description: The constituent events of one bulk batch, oldest first. Org admins
        only.
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          type: string
      - description: Batch ID
        in: path
        name: batch_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/admin.auditEntryResponse'
                type: array
          description: Events
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not found (also returned to non-admins)
      security:
      - BearerAuth: []
      summary: Audit log batch events (admin)
      tags:
      - admin
  /orgs/{org_id}/grants/bulk-apply:
    post:
      description: 'Applies the changes atomically: one transaction, one batch_id,
        one audit batch. A failure anywhere rolls back everything. Org admins only.'
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/admin.bulkApplyRequest'
                description: Changes and optional ticket_ref
                summary: body
        description: Changes and optional ticket_ref
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin.bulkResultResponse'
          description: Applied diff with batch_id
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Validation error — nothing applied
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not found (also returned to non-admins)
      security:
      - BearerAuth: []
      summary: Apply bulk grant changes (admin)
      tags:
      - admin
  /orgs/{org_id}/grants/bulk-preview:
    post:
      description: Computes the itemised diff (creates, role changes, revocations)
        the given changes would apply, using the same computation apply uses. Nothing
        is written. Org admins only.
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/admin.bulkPreviewRequest'
                description: Requested cell states
                summary: body
        description: Requested cell states
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin.bulkResultResponse'
          description: The diff
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Validation error — the whole batch is rejected
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not found (also returned to non-admins)
      security:
      - BearerAuth: []
      summary: Preview bulk grant changes (admin)
      tags:
      - admin
  /orgs/{org_id}/invites:
    get:
      description: Pending (not accepted, not revoked) invites, expired ones included
        so they can be resent or revoked. Org admins only.
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/invites.inviteResponse'
                type: array
          description: Pending invites
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not authenticated
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not found (also returned to non-admins)
      security:
      - BearerAuth: []
      summary: List pending invites (admin)
      tags:
      - admin
    post:
      description: Invites one or many emails with an org role and optional initial
        team. Returns a per-email outcome; each created invite carries its one-time
        invite_url — the raw token is never stored and cannot be retrieved again.
        Org admins only.
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/invites.createInvitesRequest'
                description: Emails, org role, optional team
                summary: body
        description: Emails, org role, optional team
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/invites.createInviteResult'
                type: array
          description: Per-email outcomes
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Validation error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not found (also returned to non-admins)
      security:
      - BearerAuth: []
      summary: Create invites (admin)
      tags:
      - admin
  /orgs/{org_id}/invites/{invite_id}:
    delete:
      description: Revokes a pending invite. The invite link stops working immediately.
        Org admins only.
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          type: string
      - description: Invite ID
        in: path
        name: invite_id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Revoked
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not found or no longer active
      security:
      - BearerAuth: []
      summary: Revoke invite (admin)
      tags:
      - admin
  /orgs/{org_id}/invites/{invite_id}/resend:
    post:
      description: Generates a fresh token and expiry for a pending invite. The previous
        link stops working. Returns the new one-time invite_url. Org admins only.
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          type: string
      - description: Invite ID
        in: path
        name: invite_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invites.createdInviteResponse'
          description: New invite URL
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not found or no longer active
      security:
      - BearerAuth: []
      summary: Resend invite (admin)
      tags:
      - admin
  /orgs/{org_id}/members/search:
    get:
      description: Name-or-email search over active members, for person pickers. Bounded
        result set. Any org member.
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          type: string
      - description: Search text (empty returns the first page alphabetically)
        in: query
        name: q
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/admin.personRefResponse'
                type: array
          description: Matches
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not authenticated
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Org not found or caller not a member
      security:
      - BearerAuth: []
      summary: Search org members
      tags:
      - admin
  /orgs/{org_id}/users:
    get:
      description: Every member with org role, primary team, status, and last sign-in.
        Org admins only; non-admins receive 404.
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/admin.personResponse'
                type: array
          description: Members
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not authenticated
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not found (also returned to non-admins)
      security:
      - BearerAuth: []
      summary: List org members (admin)
      tags:
      - admin
  /orgs/{org_id}/users/{user_id}:
    delete:
      description: Drops the membership, team memberships, and grants in one transaction.
        The user account and their authored content survive with attribution intact.
        The last active admin cannot be removed. Org admins only.
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          type: string
      - description: User ID
        in: path
        name: user_id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Removed from org
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Last-admin protection
      security:
      - BearerAuth: []
      summary: Remove member from org (admin)
      tags:
      - admin
    patch:
      description: Change a member's org role (member|admin) or primary team. The
        last active admin cannot be demoted. Org admins only.
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          type: string
      - description: User ID
        in: path
        name: user_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/admin.updatePersonRequest'
                description: Fields to change
                summary: body
        description: Fields to change
        required: true
      responses:
        "204":
          description: Updated
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Validation error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Not found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SwaggerErrorResponse'
          description: Last-admin protection
      security:
      - BearerAuth: []
      summary: Update org member (admin)
      tags:
